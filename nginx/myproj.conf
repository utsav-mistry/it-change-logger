# ══════════════════════════════════════════════════════════════════════════════
#  myproj.tld — Production NGINX configuration
#  Covers: myproj.tld | api.myproj.tld | status.myproj.tld
#  HTTP (80) → redirect to HTTPS (443)
#  HTTPS (443) → reverse-proxy to PM2-managed services on localhost
#
#  Deploy:
#    sudo cp nginx/myproj.conf /etc/nginx/sites-available/myproj
#    sudo ln -s /etc/nginx/sites-available/myproj /etc/nginx/sites-enabled/myproj
#    sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════════════════════

# ── Upstream definitions ──────────────────────────────────────────────────────

upstream frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream api_upstream {
    server 127.0.0.1:5000;
    keepalive 16;
}

# ── HTTP → HTTPS redirect (all three vhosts) ─────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name myproj.tld api.myproj.tld status.myproj.tld;

    # Let's Encrypt challenge (Certbot writes here)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
#  myproj.tld  →  Frontend (PM2 serve / 3000)
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myproj.tld;

    # ── SSL ────────────────────────────────────────────────────────────────────
    # PRODUCTION  → replace with Let's Encrypt paths from Certbot
    # SELF-SIGNED → generated by setup.sh
    ssl_certificate     /etc/ssl/certs/myproj.crt;
    ssl_certificate_key /etc/ssl/private/myproj.key;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Proxy to frontend ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # SPA: let the frontend router handle 404s
        proxy_intercept_errors on;
        error_page 404 /index.html;
    }

    # ── Static asset caching ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
#  api.myproj.tld  →  Backend API (PM2 cluster / 5000)
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.myproj.tld;

    ssl_certificate     /etc/ssl/certs/myproj.crt;
    ssl_certificate_key /etc/ssl/private/myproj.key;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

    add_header X-Frame-Options           "DENY"         always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── API proxy ──────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Pass through client request body to cluster
        client_max_body_size 10M;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
#  status.myproj.tld  →  Status dashboard (static HTML served by NGINX)
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.myproj.tld;

    ssl_certificate     /etc/ssl/certs/myproj.crt;
    ssl_certificate_key /etc/ssl/private/myproj.key;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root  /var/www/status;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No caching for the dashboard (data must be fresh)
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}

# ── WebSocket connection upgrade map ─────────────────────────────────────────
# Must be in the http {} block — add to /etc/nginx/nginx.conf if not present:
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
